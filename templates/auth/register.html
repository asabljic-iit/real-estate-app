{% extends 'base.html' %}

{% block header %}
    {% block title %}Register{% endblock %}
{% endblock %}

{% block content %}
    <div class='auth'>
        <h1>Register</h1>
        {% for message in get_flashed_messages() %}
            <div class='flash'>{{ message }}</div>
        {% endfor %}
        <form method='post'>
            <label for='acctype'>Are you a:</label>
            <input type='radio' name='acctype' id='renter' onclick='toggleAgencyField()' required>
            <label for='renter'>Renter</label>
            <input type='radio' name='acctype' id='agent' onclick='toggleAgencyField()' required>
            <label for='agent'>Agent</label>
            <br><br>
            <div id='agencyField' style='display: none; padding: 0; text-align: right;'>
                <label for='agency'>Agency:</label>
                <input name='agency' id='agency' required>
                <br><br>
            </div>
            <label for='email'>Email:</label>
            <input type='email' name='email' id='email' required>
            <br><br>
            <label for='name'>Name:</label>
            <input name='name' id='name' required>
            <br><br>
            <label for='password'>Password:</label>
            <input type='password' name='password' id='password' required>
            <br><br>
            <input type='submit' value='Register'>
        </form>
        <br><br>
        <a href="{{ url_for('login') }}"><button>Login Instead</button></a>
    </div>

    <script>
        function toggleAgencyField() {
            // Get the radio buttons and the field container
            const agentRadio = document.getElementById('agent');
            const agencyField = document.getElementById('agencyField');
            const agencyNameInput = document.getElementById('agency');
            
            if (agentRadio.checked) {
                // If Agent is selected, show the field and make it required
                agencyField.style.display = 'block';
                agencyNameInput.required = true;
            } else {
                // If Renter is selected, hide the field and remove the required attribute
                agencyField.style.display = 'none';
                agencyNameInput.required = false;
                
                // Optional: Clear the input when hidden
                agencyNameInput.value = ''; 
            }
        }

        // Run the check once when the page loads, in case the browser remembers the state
        document.addEventListener('DOMContentLoaded', toggleAgencyField);
    </script>
{% endblock %}
